<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      h1 {
        text-align: center;
        color: #333;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      th,
      td {
        padding: 12px 16px;
        border: 1px solid #ddd;
        text-align: left;
      }

      th {
        background-color: #343a40;
        color: white;
        font-weight: bold;
        text-align: center;
      }

      tr:nth-child(even) {
        background-color: #f8f9fa;
      }

      tr:hover {
        background-color: #e9f5ff;
      }

      td:last-child {
        text-align: center;
      }

      .passed {
        color: #198754;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Báo cáo kiểm thử</h1>

    <table>
      <thead>
        <tr>
          <th>Test Case</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>test_hover</td>
          <td class="passed">✓ Passed</td>
        </tr>
        <tr>
          <td>test_drag_and_drop</td>
          <td class="passed">✓ Passed</td>
        </tr>
        <tr>
          <td>test_click_and_hold</td>
          <td class="passed">✓ Passed</td>
        </tr>
        <tr>
          <td>test_click_and_hold_with_offset</td>
          <td class="passed">✓ Passed</td>
        </tr>
        <tr>
          <td>test_keyboard_interaction</td>
          <td class="passed">✓ Passed</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
